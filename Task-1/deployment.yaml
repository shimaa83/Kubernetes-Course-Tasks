
apiVersion: v1
kind: Namespace
metadata:
  name: webapp

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  namespace: webapp
  labels:
    app: web

spec:
  replicas: 3

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      shareProcessNamespace: true

      initContainers:
        - name: init-done
          image: busybox:1.36
          command:
            - sh
            - -c
            - echo done

      containers:

        # Main Container
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80

          command:
            - sh
            - -c
            - |
              echo "<h1>hello from shimaa : $(date '+%Y-%m-%d %H:%M:%S')</h1>" > /usr/share/nginx/html/index.html
              nginx -g 'daemon off;'

        # Sidecar Container
        - name: time-updater
          image: busybox:1.36

          securityContext:
            capabilities:
              add:
                - SYS_PTRACE

          command:
            - sh
            - -c
            - |
              while true; do
                PID=$(pgrep -o nginx)
                if [ -n "$PID" ]; then
                  echo "<h1>hello from shimaa : $(date '+%Y-%m-%d %H:%M:%S')</h1>" > /proc/$PID/root/usr/share/nginx/html/index.html
                fi
                sleep 5
              done

